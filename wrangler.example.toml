# Self-hosting example. Choose a unique Worker name and rate-limit namespace IDs.
name = "byok-chat-self-hosted"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = false

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "STATUS_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 120
period = 60
